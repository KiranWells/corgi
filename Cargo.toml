[package]
name = "corgi-fractal-engine"
version = "0.3.1"
edition = "2024"
authors = ["Kiran Wells <kiranwells at proton dot me>"]
description = "Corgi is a performance-focused fractal rendering engine capable of ultra-deep zooms and highly flexible styling."
homepage = "https://github.com/KiranWells/corgi"
repository = "https://github.com/KiranWells/corgi"
license = "Apache-2.0"
keywords = ["fractals", "mandelbrot", "julia", "graphics"]

[lib]
name = "corgi_lib"
path = "src/lib.rs"

[[bin]]
name = "corgi"
path = "src/main.rs"
required-features = ["binary-deps"]

[dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
documented = "0.9.2"
ecolor = { version = "0.33.0", features = ["serde", "bytemuck"] }
emath = "0.33.3"
exr = "1.74.0"
image = { version = "0.25", features = ["avif-native"] }
little_exif = "0.6.23"
parking_lot = "0.12.5"
pollster = "0.4.0"
rug = "1.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = { version = "0.9.8", features = ["serde"] }
tracing = "0.1"
wesl = "0.3.2"
wgpu = "27"
# binary deps
clap = { version = "4.5.43", features = ["derive"], optional = true }
color-eyre = { version = "0.6", optional = true }
directories = { version = "6.0.0", optional = true }
eframe = { version = "0.33.0", default-features = false, features = ["default_fonts","wayland","wgpu","x11"] , optional=true}
egui_material_icons = { version = "0.5.0", optional = true }
egui_taffy = { version = "0.10.0", optional = true }
rfd = { version = "0.15.4", features = ["xdg-portal"], optional = true }
taffy = { version = "0.7.7", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
egui_extras = { version = "0.33.3", optional = true, features = ["file", "image", "svg"] }
nanoid = { version = "0.5.0", optional = true }
rand = { version = "0.10.1", optional = true }
rand_seeder = { version = "0.5.0", optional = true }
derive_more = { version = "2.1.1", features = ["add", "add_assign", "eq", "mul", "mul_assign", "not"] }
rayon = "1.12.0"
cargo-packager-resource-resolver = { version = "0.1.2", features = ["auto-detect-format"], optional = true }

[dev-dependencies]
pastey = "0.2.3"

[features]
binary-deps = ["clap", "color-eyre", "directories", "eframe", "egui_extras", "egui_material_icons", "egui_taffy", "rfd", "taffy", "tracing-subscriber", "nanoid", "rand", "rand_seeder", "cargo-packager-resource-resolver"]

[build-dependencies]
icns = { version = "0.4.0", features = ["png", "pngio"], default-features = false }
ico = "0.5.0"
regex = "1.12.3"
resvg = "0.47.0"
wesl = "0.3.2"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true

[package.metadata.packager]
product-name = "Corgi"
identifier = "com.kiranwells.corgi"
homepage = "https://github.com/KiranWells/corgi"
before-each-package-command = "cargo build --features=\"binary-deps\" --release"
publisher = "Kiran Wells"
resources = ["presets"]
icons = [
  "assets/logo/icon.svg",
  "assets/logo/icon_*.png",
  "assets/logo/icon.ico",
  "assets/logo/icon.icns",
]
out_dir = "target/release/packager"

[[package.metadata.packager.file_associations]]
extensions = ["corg"]
mime_type = "application/x-corgi-settings"
description = "Corgi fractal settings file (JSON)"

[[package.metadata.packager.file_associations]]
extensions = ["png"]
mime_type = "image/png"
[[package.metadata.packager.file_associations]]
extensions = ["jpeg", "jpg"]
mime_type = "image/jpeg"
[[package.metadata.packager.file_associations]]
extensions = ["webp"]
mime_type = "image/webp"
[[package.metadata.packager.file_associations]]
extensions = ["avif"]
mime_type = "image/avif"

[package.metadata.packager.deb]
depends = ["libdav1d7"]
[package.metadata.packager.pacman]
depends = ["dav1d"]
